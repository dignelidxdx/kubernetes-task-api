apiVersion: batch/v1
kind: Job
metadata:
  name: task-api-db-init
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-api-db
                  key: DATABASE_URL
          command: ["sh", "-c"]
          args: ["psql \"$DATABASE_URL\" --file=/init/init.sql"]
          volumeMounts:
            - name: init-sql
              mountPath: /init
      volumes:
        - name: init-sql
          configMap:
            name: task-api-db-init
