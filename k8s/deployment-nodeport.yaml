apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-nodeport
  labels:
    app: task-api-nodeport
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-api-nodeport
  template:
    metadata:
      labels:
        app: task-api-nodeport
    spec:
      containers:
        - name: task-api
          image: kubernetes-task-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000

---

apiVersion: v1
kind: Service
metadata:
  name: task-api-nodeport
spec:
  type: NodePort
  selector:
    app: task-api-nodeport
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30007
