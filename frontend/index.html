<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kubernetes Linktree</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: #fff; font-family: Arial, sans-serif; background: linear-gradient(135deg, #15244a, #2563eb 45%, #111827); }
    body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(#0008, #0005), url("https://static.platzi.com/media/kubernetes-2024-course-ai.jpeg") center/cover; z-index: -1; }
    .container { width: min(100%, 800px); margin: auto; padding: 28px 20px; text-align: center; }
    .avatar { width: 150px; height: 150px; object-fit: cover; border: 4px solid #fff; border-radius: 50%; box-shadow: 0 0 20px #34d39999; }
    .name { display: inline-block; margin: 14px 0 6px; padding: 7px 16px; border-radius: 6px; background: #1e3a8ae6; font-size: 24px; font-weight: 700; }
    .subtitle { text-shadow: 2px 2px 4px #000; }
    h2 { margin: 28px 0 10px; color: #fff; font-size: 21px; letter-spacing: 1px; text-shadow: 2px 2px 4px #000; }
    .links { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .links a, button { width: min(80%, 520px); padding: 12px 20px; border: 2px solid #fff; border-radius: 10px; color: #fff; background: #2563ebdd; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; transition: .2s; }
    .links a:hover, button:hover { color: #fff; background: #34d399dd; transform: translateY(-2px); }
    .tasks-status { min-height: 22px; margin: 12px; }
    .task-link { background: #1e3a8ae6 !important; text-align: left; }
    .task-link.completed { opacity: .75; text-decoration: line-through; }
    .refresh { width: auto; border: 1px solid #fff; padding: 8px 18px; font-size: 14px; }
    .task-form { display: flex; gap: 8px; width: min(80%, 520px); margin: 0 auto 12px; }
    .task-form input { min-width: 0; flex: 1; padding: 12px; border: 2px solid #fff; border-radius: 10px; font-size: 16px; }
    .task-form button { width: auto; white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .bottom { margin-top: 36px; color: #fff; font-size: 14px; text-shadow: 1px 1px 2px #000; }
    .bottom span { color: #34d399; }
    @media (max-width: 576px) { .links a, .task-form { width: 100%; } .task-form { flex-direction: column; } .task-form button { width: 100%; } }
  </style>
</head>
<body>
  <main class="container">
    <img class="avatar" src="https://avatars.githubusercontent.com/u/13629408?s=200&v=4" alt="Kubernetes" />
    <div><span class="name">Kubernetes Linktree</span></div>
    <p class="subtitle">Links and tasks for the Kubernetes Task API</p>
    <h2>API AND DOCUMENTATION</h2>
    <div class="links">
      <a href="/api/docs" target="_blank" rel="noreferrer">Swagger API</a>
      <a href="/api/health" target="_blank" rel="noreferrer">Backend health</a>
      <a href="/api/tasks" target="_blank" rel="noreferrer">Tasks as JSON</a>
    </div>
    <h2>BACKEND TASKS</h2>
    <p id="tasks-status" class="tasks-status">Loading tasks from the backend…</p>
    <form id="create-task-form" class="task-form">
      <label class="sr-only" for="task-title">New task</label>
      <input id="task-title" name="title" type="text" minlength="1" placeholder="Type a new task" required />
      <button type="submit">＋ Create task</button>
    </form>
    <div id="tasks-list" class="links"></div>
    <button id="refresh-tasks" class="refresh" type="button">Refresh tasks</button>
    <div class="bottom">♥ <span>Nginx frontend · FastAPI backend · Kubernetes</span> ♥</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
