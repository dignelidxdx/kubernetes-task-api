server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the public URL stable while the API remains private in the cluster.
    location = /api {
        return 308 /api/;
    }

    # Strip /api before forwarding. FastAPI receives /health, /tasks, and /docs
    # while ROOT_PATH=/api keeps generated documentation URLs public-correct.
    location /api/ {
        proxy_pass http://task-api.default.svc.cluster.local:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
